<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Right-click each image and "Save As" to get the icons, or they are auto-generated on first load of the app.</p>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
    const s = canvas.width;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#1a0a2e';
    ctx.fillRect(0, 0, s, s);

    // Green circle
    const cx = s / 2, cy = s / 2, r = s * 0.38;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#2a1a0a';
    ctx.fill();
    ctx.lineWidth = s * 0.03;
    ctx.strokeStyle = '#7cfc00';
    ctx.stroke();

    // Emoji text
    ctx.font = `${s * 0.35}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💨', cx, cy);

    return canvas.toDataURL('image/png');
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
</script>
</body>
</html>
