<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fart Button">
    <meta name="theme-color" content="#1a0a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>The Fart Button</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a2e, #2d1b4e, #1a2a1a);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        h1 {
            color: #7cfc00;
            font-size: clamp(1.6rem, 6vw, 2.5rem);
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(124, 252, 0, 0.5);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: clamp(0.8rem, 3vw, 1rem);
            margin-bottom: clamp(15px, 4vh, 40px);
        }

        .fart-counter {
            color: #ffcc00;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            margin-bottom: 12px;
        }

        .fart-name {
            color: #ff6ec7;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: bold;
            margin-bottom: clamp(15px, 3vh, 30px);
            min-height: 2em;
            text-align: center;
            transition: opacity 0.2s;
            padding: 0 20px;
        }

        .fart-button {
            width: clamp(160px, 45vw, 220px);
            height: clamp(160px, 45vw, 220px);
            border-radius: 50%;
            border: 5px solid #7cfc00;
            background: radial-gradient(circle at 35% 35%, #4a2a0a, #2a1a0a);
            color: #7cfc00;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
            box-shadow: 0 0 30px rgba(124, 252, 0, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .fart-button:active {
            transform: scale(0.93);
            border-color: #ff6ec7;
            box-shadow: 0 0 60px rgba(255, 110, 199, 0.6), inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .fart-button .emoji {
            font-size: clamp(3rem, 10vw, 4rem);
            display: block;
            margin-bottom: 2px;
        }

        .fart-button .label {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .progress-bar {
            display: flex;
            gap: clamp(4px, 1.5vw, 8px);
            margin-top: clamp(20px, 4vh, 40px);
        }

        .progress-dot {
            width: clamp(12px, 3.5vw, 18px);
            height: clamp(12px, 3.5vw, 18px);
            border-radius: 50%;
            background: #333;
            border: 2px solid #555;
            transition: background 0.3s, border-color 0.3s, transform 0.3s;
        }

        .progress-dot.active {
            background: #7cfc00;
            border-color: #7cfc00;
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(124, 252, 0, 0.6);
        }

        .progress-dot.past {
            background: #3a6b3a;
            border-color: #4a8b4a;
        }

        .gas-cloud {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            opacity: 0;
            z-index: 10;
        }

        @keyframes float-up {
            0% {
                opacity: 0.7;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(2.5);
            }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-2deg); }
            50% { transform: translateX(8px) rotate(2deg); }
            75% { transform: translateX(-4px) rotate(-1deg); }
        }

        .stats {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            color: #666;
            font-size: 0.85rem;
        }

        .install-prompt {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(124, 252, 0, 0.15);
            border: 1px solid #7cfc00;
            color: #7cfc00;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="install-prompt" id="installPrompt" onclick="installApp()">
        Tap to install as app
    </div>

    <h1>The Fart Button</h1>
    <p class="subtitle">Press the button. You know you want to.</p>
    <div class="fart-counter">Fart #<span id="counter">1</span> of 12</div>
    <div class="fart-name" id="fartName">Ready to rip...</div>
    <button class="fart-button" id="fartBtn">
        <span class="emoji">💨</span>
        <span class="label">FART</span>
    </button>
    <div class="progress-bar" id="progressBar"></div>
    <div class="stats" id="stats">Total farts: 0</div>

    <script>
        // --- Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // --- Install Prompt ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').style.display = 'block';
        });

        function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                document.getElementById('installPrompt').style.display = 'none';
            });
        }

        // --- Auto-generate icons if missing ---
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a0a2e';
            ctx.fillRect(0, 0, size, size);
            const cx = size / 2, cy = size / 2, r = size * 0.38;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#2a1a0a';
            ctx.fill();
            ctx.lineWidth = size * 0.03;
            ctx.strokeStyle = '#7cfc00';
            ctx.stroke();
            ctx.font = `${size * 0.35}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('\uD83D\uDCA8', cx, cy);
            return canvas.toDataURL('image/png');
        }

        // Set apple-touch-icon dynamically
        const touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
        if (touchIcon) touchIcon.href = generateIcon(192);

        // --- Audio Engine ---
        let audioCtx;
        let audioUnlocked = false;
        let masterGain;
        let compressor;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // Master gain + compressor for louder, punchier output on phone speakers
                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.value = -20;
                compressor.knee.value = 10;
                compressor.ratio.value = 4;
                compressor.attack.value = 0.003;
                compressor.release.value = 0.1;
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 3.0;
                masterGain.connect(compressor);
                compressor.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function getOutput() {
            getAudioCtx();
            return masterGain;
        }

        // iOS/mobile Safari requires playing a silent buffer on first user gesture
        // to permanently unlock audio playback
        function unlockAudio() {
            if (audioUnlocked) return;
            const ctx = getAudioCtx();
            const silentBuffer = ctx.createBuffer(1, 1, ctx.sampleRate);
            const source = ctx.createBufferSource();
            source.buffer = silentBuffer;
            source.connect(ctx.destination);
            source.start(0);
            source.onended = () => { audioUnlocked = true; };
            // Also try resuming on iOS which suspends by default
            ctx.resume();
        }

        // --- Realistic Fart Synthesis Engine ---
        // Real farts = tissue vibration (low osc + irregular LFO) + turbulent air (shaped noise)
        // + body resonance (formant filters) + amplitude flutter (tremolo)

        // Tissue vibration layer: oscillator with wobbly pitch
        function tissueVibration({ freq, endFreq, duration, gain, flutter, flutterSpeed, type }) {
            const ctx = getAudioCtx();
            const now = ctx.currentTime;
            const out = getOutput();

            // Main oscillator - the "buzz" of vibrating tissue
            const osc = ctx.createOscillator();
            osc.type = type || 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            if (endFreq !== undefined) {
                osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), now + duration);
            }

            // Irregular wobble LFO - makes it sound organic, not like a synth
            const lfo1 = ctx.createOscillator();
            lfo1.frequency.setValueAtTime(flutterSpeed || 12, now);
            // Speed up or slow down the wobble over time
            lfo1.frequency.linearRampToValueAtTime((flutterSpeed || 12) * 0.6, now + duration);
            const lfo1Gain = ctx.createGain();
            lfo1Gain.gain.value = flutter || freq * 0.3;
            lfo1.connect(lfo1Gain);
            lfo1Gain.connect(osc.frequency);

            // Secondary slower wobble for organic irregularity
            const lfo2 = ctx.createOscillator();
            lfo2.frequency.value = (flutterSpeed || 12) * 0.37;
            const lfo2Gain = ctx.createGain();
            lfo2Gain.gain.value = (flutter || freq * 0.3) * 0.5;
            lfo2.connect(lfo2Gain);
            lfo2Gain.connect(osc.frequency);

            // Amplitude tremolo - the "sputtering" quality
            const tremolo = ctx.createOscillator();
            tremolo.frequency.value = (flutterSpeed || 12) * 1.7;
            const tremoloGain = ctx.createGain();
            tremoloGain.gain.value = gain * 0.4;
            tremolo.connect(tremoloGain);

            const ampGain = ctx.createGain();
            ampGain.gain.setValueAtTime(gain, now);
            ampGain.gain.setValueAtTime(gain * 1.1, now + duration * 0.05);
            ampGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            tremoloGain.connect(ampGain.gain);

            // Body resonance filter - simulates sound bouncing in... the cavity
            const bodyFilter = ctx.createBiquadFilter();
            bodyFilter.type = 'bandpass';
            bodyFilter.frequency.setValueAtTime(Math.min(freq * 3, 600), now);
            bodyFilter.frequency.linearRampToValueAtTime(Math.min(freq * 2, 300), now + duration);
            bodyFilter.Q.value = 1.5;

            // Low pass to remove harsh digital artifacts
            const lpf = ctx.createBiquadFilter();
            lpf.type = 'lowpass';
            lpf.frequency.setValueAtTime(2000, now);
            lpf.frequency.linearRampToValueAtTime(400, now + duration);

            osc.connect(bodyFilter);
            bodyFilter.connect(lpf);
            lpf.connect(ampGain);
            ampGain.connect(out);

            osc.start(now);
            lfo1.start(now);
            lfo2.start(now);
            tremolo.start(now);
            osc.stop(now + duration + 0.05);
            lfo1.stop(now + duration + 0.05);
            lfo2.stop(now + duration + 0.05);
            tremolo.stop(now + duration + 0.05);
        }

        // Turbulent air layer: filtered noise shaped to sound like air escaping
        function airLayer({ duration, filterFreq, filterEnd, gain, Q, type, attack }) {
            const ctx = getAudioCtx();
            const now = ctx.currentTime;
            const out = getOutput();
            const bufferSize = Math.ceil(ctx.sampleRate * (duration + 0.1));
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);

            // Brownian noise sounds more natural than white noise for farts
            if (type === 'brown') {
                let last = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    last = (last + (0.02 * white)) / 1.02;
                    data[i] = last * 3.5;
                }
            } else {
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
            }

            const source = ctx.createBufferSource();
            source.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(filterFreq, now);
            filter.frequency.exponentialRampToValueAtTime(Math.max(filterEnd, 1), now + duration);
            filter.Q.value = Q || 2;

            // Second filter for more body-like resonance
            const filter2 = ctx.createBiquadFilter();
            filter2.type = 'lowpass';
            filter2.frequency.setValueAtTime(filterFreq * 1.5, now);
            filter2.frequency.exponentialRampToValueAtTime(Math.max(filterEnd * 0.8, 1), now + duration);

            const gainNode = ctx.createGain();
            const atk = attack || 0.01;
            gainNode.gain.setValueAtTime(0.001, now);
            gainNode.gain.linearRampToValueAtTime(gain, now + atk);
            gainNode.gain.setValueAtTime(gain, now + atk);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

            source.connect(filter);
            filter.connect(filter2);
            filter2.connect(gainNode);
            gainNode.connect(out);

            source.start(now);
            source.stop(now + duration + 0.05);
        }

        // Combine tissue + air for a realistic fart
        function realisticFart({ freq, endFreq, duration, tissueGain, airGain,
                                  flutter, flutterSpeed, airFreq, airEnd, airQ,
                                  noiseType, oscType, attack }) {
            tissueVibration({
                freq, endFreq: endFreq || freq * 0.7, duration,
                gain: tissueGain || 0.25, flutter, flutterSpeed,
                type: oscType || 'sawtooth'
            });
            airLayer({
                duration, filterFreq: airFreq || freq * 4,
                filterEnd: airEnd || freq * 1.5, gain: airGain || 0.15,
                Q: airQ || 2.5, type: noiseType || 'brown', attack
            });
        }

        const fartSounds = [
            {
                name: "The Squeaker",
                play: () => realisticFart({
                    freq: 250, endFreq: 400, duration: 0.18,
                    tissueGain: 0.2, airGain: 0.12,
                    flutter: 120, flutterSpeed: 35,
                    airFreq: 1200, airEnd: 800, oscType: 'square'
                })
            },
            {
                name: "The Rumbler",
                play: () => realisticFart({
                    freq: 65, endFreq: 45, duration: 1.0,
                    tissueGain: 0.35, airGain: 0.2,
                    flutter: 20, flutterSpeed: 7,
                    airFreq: 300, airEnd: 80, noiseType: 'brown',
                    airQ: 1.5, attack: 0.05
                })
            },
            {
                name: "The Ripper",
                play: () => realisticFart({
                    freq: 110, endFreq: 70, duration: 0.5,
                    tissueGain: 0.35, airGain: 0.25,
                    flutter: 50, flutterSpeed: 18,
                    airFreq: 600, airEnd: 200, noiseType: 'brown',
                    airQ: 3
                })
            },
            {
                name: "The Machine Gun",
                play: () => {
                    const count = 5 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < count; i++) {
                        const gap = 55 + Math.random() * 40;
                        setTimeout(() => realisticFart({
                            freq: 120 + Math.random() * 30,
                            endFreq: 90 + Math.random() * 20,
                            duration: 0.04 + Math.random() * 0.03,
                            tissueGain: 0.2, airGain: 0.15,
                            flutter: 40, flutterSpeed: 25 + Math.random() * 15,
                            airFreq: 500, airEnd: 250
                        }), i * gap);
                    }
                }
            },
            {
                name: "The Slow Leak",
                play: () => {
                    // Mostly air, very little vibration - the silent-but-deadly
                    airLayer({
                        duration: 1.8, filterFreq: 600, filterEnd: 150,
                        gain: 0.2, Q: 1.5, type: 'brown', attack: 0.1
                    });
                    // Tiny bit of flutter at the start
                    tissueVibration({
                        freq: 180, endFreq: 120, duration: 0.15,
                        gain: 0.06, flutter: 80, flutterSpeed: 30
                    });
                }
            },
            {
                name: "The Trumpet",
                play: () => realisticFart({
                    freq: 160, endFreq: 220, duration: 0.45,
                    tissueGain: 0.3, airGain: 0.12,
                    flutter: 80, flutterSpeed: 22,
                    airFreq: 800, airEnd: 500, oscType: 'sawtooth',
                    airQ: 3
                })
            },
            {
                name: "The Whoopee Cushion",
                play: () => {
                    // Starts loud, long deflating vibration
                    realisticFart({
                        freq: 130, endFreq: 60, duration: 0.7,
                        tissueGain: 0.35, airGain: 0.25,
                        flutter: 55, flutterSpeed: 14,
                        airFreq: 500, airEnd: 120, noiseType: 'brown',
                        airQ: 2, attack: 0.02
                    });
                }
            },
            {
                name: "The Squeaky Gate",
                play: () => {
                    // High pitched with wavering pitch
                    realisticFart({
                        freq: 320, endFreq: 500, duration: 0.35,
                        tissueGain: 0.15, airGain: 0.18,
                        flutter: 200, flutterSpeed: 28,
                        airFreq: 1500, airEnd: 900, oscType: 'sine',
                        airQ: 4
                    });
                }
            },
            {
                name: "The Thunder Roll",
                play: () => {
                    // Deep rumbling with shifting intensity
                    realisticFart({
                        freq: 50, endFreq: 35, duration: 1.4,
                        tissueGain: 0.4, airGain: 0.25,
                        flutter: 15, flutterSpeed: 5,
                        airFreq: 250, airEnd: 60, noiseType: 'brown',
                        airQ: 1.2, attack: 0.08
                    });
                    // Add a secondary burst midway through
                    setTimeout(() => tissueVibration({
                        freq: 70, endFreq: 50, duration: 0.3,
                        gain: 0.2, flutter: 25, flutterSpeed: 9
                    }), 500);
                }
            },
            {
                name: "The Chirper",
                play: () => {
                    // Multiple short squeaky bursts with rising pitch
                    const pitches = [200, 260, 310, 280];
                    pitches.forEach((p, i) => {
                        setTimeout(() => realisticFart({
                            freq: p, endFreq: p * 1.3, duration: 0.08 + Math.random() * 0.04,
                            tissueGain: 0.15, airGain: 0.1,
                            flutter: 100, flutterSpeed: 30 + i * 5,
                            airFreq: 1000, airEnd: 700, oscType: 'sine'
                        }), i * 120 + Math.random() * 30);
                    });
                }
            },
            {
                name: "The Bubbler",
                play: () => {
                    // Wet bubbly pops - irregular timing, varied pitch
                    const count = 6 + Math.floor(Math.random() * 4);
                    let t = 0;
                    for (let i = 0; i < count; i++) {
                        t += 30 + Math.random() * 70;
                        const f = 90 + Math.random() * 80;
                        setTimeout(() => {
                            realisticFart({
                                freq: f, endFreq: f * 0.7, duration: 0.05 + Math.random() * 0.06,
                                tissueGain: 0.18, airGain: 0.2,
                                flutter: 30, flutterSpeed: 15 + Math.random() * 10,
                                airFreq: 400 + Math.random() * 200,
                                airEnd: 150, noiseType: 'brown', airQ: 3
                            });
                        }, t);
                    }
                }
            },
            {
                name: "The Grand Finale",
                play: () => {
                    // Epic multi-phase fart: starts deep, builds, ends with squeaker
                    // Phase 1: deep rumble
                    realisticFart({
                        freq: 55, endFreq: 40, duration: 0.8,
                        tissueGain: 0.35, airGain: 0.2,
                        flutter: 18, flutterSpeed: 6,
                        airFreq: 250, airEnd: 80, noiseType: 'brown', attack: 0.05
                    });
                    // Phase 2: mid ripper
                    setTimeout(() => realisticFart({
                        freq: 100, endFreq: 75, duration: 0.6,
                        tissueGain: 0.3, airGain: 0.25,
                        flutter: 40, flutterSpeed: 15,
                        airFreq: 500, airEnd: 180, noiseType: 'brown'
                    }), 700);
                    // Phase 3: sputtering end
                    setTimeout(() => {
                        for (let i = 0; i < 4; i++) {
                            setTimeout(() => realisticFart({
                                freq: 150 + i * 40, endFreq: 200 + i * 50,
                                duration: 0.06, tissueGain: 0.15, airGain: 0.12,
                                flutter: 80, flutterSpeed: 30,
                                airFreq: 800, airEnd: 500
                            }), i * 90);
                        }
                    }, 1200);
                }
            }
        ];

        let currentFart = 0;
        let totalFarts = 0;

        // Build progress bar
        const progressBar = document.getElementById('progressBar');
        for (let i = 0; i < 12; i++) {
            const dot = document.createElement('div');
            dot.className = 'progress-dot';
            dot.id = `dot-${i}`;
            progressBar.appendChild(dot);
        }
        updateProgress();

        function spawnGasClouds() {
            const btn = document.getElementById('fartBtn');
            const rect = btn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const colors = ['#7cfc00', '#9acd32', '#6b8e23', '#556b2f', '#8fbc8f', '#90ee90'];

            for (let i = 0; i < 8; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'gas-cloud';
                const size = 20 + Math.random() * 40;
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 120;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 50;

                cloud.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${cx - size / 2}px;
                    top: ${cy - size / 2}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    --dx: ${dx}px;
                    --dy: ${dy}px;
                    animation: float-up ${0.6 + Math.random() * 0.8}s ease-out forwards;
                `;

                document.body.appendChild(cloud);
                setTimeout(() => cloud.remove(), 1500);
            }
        }

        function updateProgress() {
            for (let i = 0; i < 12; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.className = 'progress-dot';
                if (i === currentFart) dot.classList.add('active');
                else if (i < currentFart) dot.classList.add('past');
            }
            document.getElementById('counter').textContent = currentFart + 1;
        }

        function doFart() {
            unlockAudio();

            const fart = fartSounds[currentFart];
            document.getElementById('fartName').textContent = fart.name;

            fart.play();
            spawnGasClouds();

            // Haptic feedback on supported devices
            if (navigator.vibrate) navigator.vibrate(50);

            const btn = document.getElementById('fartBtn');
            btn.classList.remove('shake');
            void btn.offsetWidth;
            btn.classList.add('shake');

            totalFarts++;
            document.getElementById('stats').textContent = `Total farts: ${totalFarts}`;

            currentFart = (currentFart + 1) % 12;
            updateProgress();
        }

        // Use touchend for faster response on mobile, with fallback to click
        const fartBtn = document.getElementById('fartBtn');
        let touched = false;
        fartBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            touched = true;
            doFart();
            setTimeout(() => touched = false, 300);
        });
        fartBtn.addEventListener('click', () => {
            if (!touched) doFart();
        });
    </script>
</body>
</html>
