<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fart Button">
    <meta name="theme-color" content="#1a0a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>The Fart Button</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a2e, #2d1b4e, #1a2a1a);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        h1 {
            color: #7cfc00;
            font-size: clamp(1.6rem, 6vw, 2.5rem);
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(124, 252, 0, 0.5);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: clamp(0.8rem, 3vw, 1rem);
            margin-bottom: clamp(15px, 4vh, 40px);
        }

        .fart-counter {
            color: #ffcc00;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            margin-bottom: 12px;
        }

        .fart-name {
            color: #ff6ec7;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: bold;
            margin-bottom: clamp(15px, 3vh, 30px);
            min-height: 2em;
            text-align: center;
            transition: opacity 0.2s;
            padding: 0 20px;
        }

        .fart-button {
            width: clamp(160px, 45vw, 220px);
            height: clamp(160px, 45vw, 220px);
            border-radius: 50%;
            border: 5px solid #7cfc00;
            background: radial-gradient(circle at 35% 35%, #4a2a0a, #2a1a0a);
            color: #7cfc00;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
            box-shadow: 0 0 30px rgba(124, 252, 0, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .fart-button:active {
            transform: scale(0.93);
            border-color: #ff6ec7;
            box-shadow: 0 0 60px rgba(255, 110, 199, 0.6), inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .fart-button .emoji {
            font-size: clamp(3rem, 10vw, 4rem);
            display: block;
            margin-bottom: 2px;
        }

        .fart-button .label {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .progress-bar {
            display: flex;
            gap: clamp(4px, 1.5vw, 8px);
            margin-top: clamp(20px, 4vh, 40px);
        }

        .progress-dot {
            width: clamp(12px, 3.5vw, 18px);
            height: clamp(12px, 3.5vw, 18px);
            border-radius: 50%;
            background: #333;
            border: 2px solid #555;
            transition: background 0.3s, border-color 0.3s, transform 0.3s;
        }

        .progress-dot.active {
            background: #7cfc00;
            border-color: #7cfc00;
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(124, 252, 0, 0.6);
        }

        .progress-dot.past {
            background: #3a6b3a;
            border-color: #4a8b4a;
        }

        .gas-cloud {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            opacity: 0;
            z-index: 10;
        }

        @keyframes float-up {
            0% {
                opacity: 0.7;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(2.5);
            }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-2deg); }
            50% { transform: translateX(8px) rotate(2deg); }
            75% { transform: translateX(-4px) rotate(-1deg); }
        }

        .stats {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            color: #666;
            font-size: 0.85rem;
        }

        .install-prompt {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(124, 252, 0, 0.15);
            border: 1px solid #7cfc00;
            color: #7cfc00;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="install-prompt" id="installPrompt" onclick="installApp()">
        Tap to install as app
    </div>

    <h1>The Fart Button</h1>
    <p class="subtitle">Press the button. You know you want to.</p>
    <div class="fart-counter">Fart #<span id="counter">1</span> of 12</div>
    <div class="fart-name" id="fartName">Ready to rip...</div>
    <button class="fart-button" id="fartBtn">
        <span class="emoji">💨</span>
        <span class="label">FART</span>
    </button>
    <div class="progress-bar" id="progressBar"></div>
    <div class="stats" id="stats">Total farts: 0</div>

    <script>
        // --- Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // --- Install Prompt ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').style.display = 'block';
        });

        function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                document.getElementById('installPrompt').style.display = 'none';
            });
        }

        // --- Auto-generate icons if missing ---
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a0a2e';
            ctx.fillRect(0, 0, size, size);
            const cx = size / 2, cy = size / 2, r = size * 0.38;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#2a1a0a';
            ctx.fill();
            ctx.lineWidth = size * 0.03;
            ctx.strokeStyle = '#7cfc00';
            ctx.stroke();
            ctx.font = `${size * 0.35}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('\uD83D\uDCA8', cx, cy);
            return canvas.toDataURL('image/png');
        }

        // Set apple-touch-icon dynamically
        const touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
        if (touchIcon) touchIcon.href = generateIcon(192);

        // --- Audio Engine ---
        let audioCtx;
        let audioUnlocked = false;
        let masterGain;
        let compressor;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // Master gain + compressor for louder, punchier output on phone speakers
                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.value = -20;
                compressor.knee.value = 10;
                compressor.ratio.value = 4;
                compressor.attack.value = 0.003;
                compressor.release.value = 0.1;
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 3.0;
                masterGain.connect(compressor);
                compressor.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function getOutput() {
            getAudioCtx();
            return masterGain;
        }

        // iOS/mobile Safari requires playing a silent buffer on first user gesture
        // to permanently unlock audio playback
        function unlockAudio() {
            if (audioUnlocked) return;
            const ctx = getAudioCtx();
            const silentBuffer = ctx.createBuffer(1, 1, ctx.sampleRate);
            const source = ctx.createBufferSource();
            source.buffer = silentBuffer;
            source.connect(ctx.destination);
            source.start(0);
            source.onended = () => { audioUnlocked = true; };
            // Also try resuming on iOS which suspends by default
            ctx.resume();
        }

        const fartSounds = [
            {
                name: "The Squeaker",
                play: () => makeFart({ freq: 220, duration: 0.15, type: 'square', lfoFreq: 30, lfoGain: 80, endFreq: 400 })
            },
            {
                name: "The Rumbler",
                play: () => makeFart({ freq: 80, duration: 0.8, type: 'sawtooth', lfoFreq: 8, lfoGain: 30, endFreq: 60, gain: 0.5 })
            },
            {
                name: "The Tuba",
                play: () => makeFart({ freq: 55, duration: 0.6, type: 'sawtooth', lfoFreq: 12, lfoGain: 20, endFreq: 45, gain: 0.4 })
            },
            {
                name: "The Machine Gun",
                play: () => {
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => makeFart({ freq: 150, duration: 0.06, type: 'square', lfoFreq: 50, lfoGain: 60, endFreq: 120 }), i * 80);
                    }
                }
            },
            {
                name: "The Slow Leak",
                play: () => makeNoise({ duration: 1.2, filterFreq: 800, filterEnd: 200, gain: 0.15 })
            },
            {
                name: "The Trumpet",
                play: () => makeFart({ freq: 180, duration: 0.4, type: 'sawtooth', lfoFreq: 25, lfoGain: 100, endFreq: 300, gain: 0.3 })
            },
            {
                name: "The Whoopee Cushion",
                play: () => makeFart({ freq: 120, duration: 0.5, type: 'sawtooth', lfoFreq: 15, lfoGain: 50, endFreq: 80, gain: 0.4 })
            },
            {
                name: "The Squeaky Door",
                play: () => makeFart({ freq: 400, duration: 0.3, type: 'sine', lfoFreq: 40, lfoGain: 200, endFreq: 600, gain: 0.2 })
            },
            {
                name: "The Thunder",
                play: () => {
                    makeFart({ freq: 50, duration: 1.0, type: 'sawtooth', lfoFreq: 6, lfoGain: 20, endFreq: 35, gain: 0.5 });
                    makeNoise({ duration: 1.0, filterFreq: 500, filterEnd: 100, gain: 0.2 });
                }
            },
            {
                name: "The Chirper",
                play: () => {
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => makeFart({ freq: 300 + i * 50, duration: 0.1, type: 'sine', lfoFreq: 35, lfoGain: 150, endFreq: 500 + i * 50, gain: 0.2 }), i * 150);
                    }
                }
            },
            {
                name: "The Bubbler",
                play: () => {
                    for (let i = 0; i < 8; i++) {
                        setTimeout(() => makeFart({ freq: 100 + Math.random() * 60, duration: 0.08, type: 'sine', lfoFreq: 20, lfoGain: 40, endFreq: 80, gain: 0.25 }), i * 60);
                    }
                }
            },
            {
                name: "The Grand Finale",
                play: () => {
                    makeFart({ freq: 60, duration: 1.5, type: 'sawtooth', lfoFreq: 10, lfoGain: 30, endFreq: 40, gain: 0.4 });
                    makeNoise({ duration: 1.5, filterFreq: 1000, filterEnd: 100, gain: 0.2 });
                    setTimeout(() => makeFart({ freq: 200, duration: 0.3, type: 'square', lfoFreq: 30, lfoGain: 100, endFreq: 400, gain: 0.2 }), 800);
                    setTimeout(() => makeFart({ freq: 300, duration: 0.2, type: 'sine', lfoFreq: 40, lfoGain: 150, endFreq: 500, gain: 0.15 }), 1200);
                }
            }
        ];

        let currentFart = 0;
        let totalFarts = 0;

        // Build progress bar
        const progressBar = document.getElementById('progressBar');
        for (let i = 0; i < 12; i++) {
            const dot = document.createElement('div');
            dot.className = 'progress-dot';
            dot.id = `dot-${i}`;
            progressBar.appendChild(dot);
        }
        updateProgress();

        function makeFart({ freq, duration, type, lfoFreq, lfoGain, endFreq, gain = 0.3 }) {
            const ctx = getAudioCtx();
            const now = ctx.currentTime;

            const osc = ctx.createOscillator();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.linearRampToValueAtTime(endFreq, now + duration);

            const lfo = ctx.createOscillator();
            lfo.frequency.value = lfoFreq;
            const lfoGainNode = ctx.createGain();
            lfoGainNode.gain.value = lfoGain;
            lfo.connect(lfoGainNode);
            lfoGainNode.connect(osc.frequency);

            const gainNode = ctx.createGain();
            gainNode.gain.setValueAtTime(gain, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1500, now);
            filter.frequency.linearRampToValueAtTime(300, now + duration);

            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(getOutput());

            osc.start(now);
            lfo.start(now);
            osc.stop(now + duration);
            lfo.stop(now + duration);
        }

        function makeNoise({ duration, filterFreq, filterEnd, gain }) {
            const ctx = getAudioCtx();
            const now = ctx.currentTime;
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const source = ctx.createBufferSource();
            source.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(filterFreq, now);
            filter.frequency.linearRampToValueAtTime(filterEnd, now + duration);
            filter.Q.value = 2;

            const gainNode = ctx.createGain();
            gainNode.gain.setValueAtTime(gain, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

            source.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(getOutput());

            source.start(now);
            source.stop(now + duration);
        }

        function spawnGasClouds() {
            const btn = document.getElementById('fartBtn');
            const rect = btn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const colors = ['#7cfc00', '#9acd32', '#6b8e23', '#556b2f', '#8fbc8f', '#90ee90'];

            for (let i = 0; i < 8; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'gas-cloud';
                const size = 20 + Math.random() * 40;
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 120;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 50;

                cloud.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${cx - size / 2}px;
                    top: ${cy - size / 2}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    --dx: ${dx}px;
                    --dy: ${dy}px;
                    animation: float-up ${0.6 + Math.random() * 0.8}s ease-out forwards;
                `;

                document.body.appendChild(cloud);
                setTimeout(() => cloud.remove(), 1500);
            }
        }

        function updateProgress() {
            for (let i = 0; i < 12; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.className = 'progress-dot';
                if (i === currentFart) dot.classList.add('active');
                else if (i < currentFart) dot.classList.add('past');
            }
            document.getElementById('counter').textContent = currentFart + 1;
        }

        function doFart() {
            unlockAudio();

            const fart = fartSounds[currentFart];
            document.getElementById('fartName').textContent = fart.name;

            fart.play();
            spawnGasClouds();

            // Haptic feedback on supported devices
            if (navigator.vibrate) navigator.vibrate(50);

            const btn = document.getElementById('fartBtn');
            btn.classList.remove('shake');
            void btn.offsetWidth;
            btn.classList.add('shake');

            totalFarts++;
            document.getElementById('stats').textContent = `Total farts: ${totalFarts}`;

            currentFart = (currentFart + 1) % 12;
            updateProgress();
        }

        // Use touchend for faster response on mobile, with fallback to click
        const fartBtn = document.getElementById('fartBtn');
        let touched = false;
        fartBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            touched = true;
            doFart();
            setTimeout(() => touched = false, 300);
        });
        fartBtn.addEventListener('click', () => {
            if (!touched) doFart();
        });
    </script>
</body>
</html>
